name: Publish wzcloud macOS to private release

'on':
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private wzcloud ref to build (tag, branch, or commit)"
        required: true
        default: "v5.2.0"
  repository_dispatch:
    types:
      - publish-private-release

permissions:
  contents: read

concurrency:
  group: build-macos-private-release-${{ inputs.source_ref || github.event.client_payload.source_ref || 'manual' }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      SOURCE_REF: ${{ inputs.source_ref || github.event.client_payload.source_ref || 'v5.2.0' }}
    steps:
      - name: Prepare SSH for private source checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '${{ secrets.WZCLOUD_DEPLOY_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Fetch private wzcloud source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin git@github.com:zzx396/wzcloud.git
          git -C source fetch --depth 1 origin "$SOURCE_REF"
          git -C source checkout --detach FETCH_HEAD
          git -C source rev-parse HEAD

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$SOURCE_REF"
          safe_ref="$(printf '%s' "$source_ref" | tr '/:@ ' '-' | tr -cd 'A-Za-z0-9._-')"
          if [[ -z "$safe_ref" ]]; then
            safe_ref="manual"
          fi
          version="$(python3 - <<'PY'
import json
with open('source/apps/desktop/src/package.json', 'r', encoding='utf-8') as fh:
    print(json.load(fh)['version'])
PY
)"
          source_sha="$(git -C source rev-parse HEAD)"
          {
            echo "source_ref=$source_ref"
            echo "safe_ref=$safe_ref"
            echo "version=$version"
            echo "source_sha=$source_sha"
            echo "release_tag=$safe_ref"
            echo "release_title=wzcloud macOS $version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: source/apps/desktop/src/package-lock.json

      - name: Build macOS artifacts
        shell: bash
        env:
          ELECTRON_BUILDER_VERSION: "26.8.1"
        run: |
          set -euo pipefail
          bash ./scripts/build-macos.sh all
        working-directory: source

      - name: Upload universal macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wzcloud-macos-universal-${{ env.SOURCE_REF }}
          path: |
            source/apps/desktop/src/build/mac-universal/*
          if-no-files-found: error

      - name: Upload architecture-specific macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wzcloud-macos-arch-${{ env.SOURCE_REF }}
          path: |
            source/apps/desktop/src/build/mac-x64/*
            source/apps/desktop/src/build/mac-arm64/*
          if-no-files-found: error

      - name: Prepare private release assets
        shell: bash
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/private-release-assets"
          mkdir -p "$release_dir"
          cp -f "source/apps/desktop/src/build/mac-universal/御鸠云-${APP_VERSION}-universal.dmg" "$release_dir/wzcloud-${APP_VERSION}-universal.dmg"
          cp -f "source/apps/desktop/src/build/mac-universal/御鸠云-${APP_VERSION}-universal.dmg.blockmap" "$release_dir/wzcloud-${APP_VERSION}-universal.dmg.blockmap"
          cp -f "source/apps/desktop/src/build/mac-universal/御鸠云-${APP_VERSION}-universal-mac.zip" "$release_dir/wzcloud-${APP_VERSION}-universal-mac.zip"
          cp -f "source/apps/desktop/src/build/mac-universal/御鸠云-${APP_VERSION}-universal-mac.zip.blockmap" "$release_dir/wzcloud-${APP_VERSION}-universal-mac.zip.blockmap"
          ls -lah "$release_dir"

      - name: Publish private wzcloud release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WZCLOUD_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.release_title }}
          SOURCE_REF: ${{ steps.meta.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          SOURCE_VERSION: ${{ steps.meta.outputs.version }}
          PRIVATE_REPO: zzx396/wzcloud
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<EOF
          Built from private repo \`$PRIVATE_REPO\`.

          - Source ref: \`$SOURCE_REF\`
          - Source commit: \`$SOURCE_SHA\`
          - App version: \`$SOURCE_VERSION\`
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          if gh release view "$RELEASE_TAG" --repo "$PRIVATE_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$PRIVATE_REPO" --title "$RELEASE_TITLE" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" --repo "$PRIVATE_REPO" --target "$SOURCE_SHA" --title "$RELEASE_TITLE" --notes-file "$notes_file"
          fi

          mapfile -t release_files < <(
            find "$RUNNER_TEMP/private-release-assets" \
              -maxdepth 1 -type f \
              | sort
          )
          if [[ "${#release_files[@]}" -eq 0 ]]; then
            echo "no release files found" >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" --repo "$PRIVATE_REPO" "${release_files[@]}" --clobber
